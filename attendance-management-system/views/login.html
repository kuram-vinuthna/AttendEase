<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | AttendEase</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head><body class="auth-body"><main class="auth-card"><div class="brand"><span class="brand-icon">✓</span><span>AttendEase</span></div><h1>Welcome back</h1><p class="muted">Sign in to manage your class attendance.</p><div id="formMessage" class="hidden"></div><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@college.edu" autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required placeholder="Enter your password" autocomplete="current-password"></div><button style="width:100%;margin-top:8px">Sign in →</button></form><div class="auth-foot">Faculty? Ask your administrator to create your account.<br>Student? <a href="/student-register">Create student portal account</a></div><div class="footer-note">Demo admin: admin@sa.com / Admin@123 · Faculty/student demo credentials are listed in README.md</div></main></body></html>
