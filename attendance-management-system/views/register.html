<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | AttendEase</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head><body class="auth-body"><main class="auth-card"><div class="brand"><span class="brand-icon">✓</span><span>AttendEase</span></div><h1>Create your account</h1><p class="muted">Faculty accounts are created by an administrator. For students, use student registration.</p><div id="formMessage" class="hidden"></div><p class="notice">Contact your college administrator to create a faculty account.</p><div class="auth-foot"><a href="/student-register">Register as a student</a></div><!-- Faculty self-registration is disabled for security. --><form id="registerForm" class="hidden"><div class="field"><label for="name">Full name</label><input id="name" required autocomplete="name" placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@college.edu"></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter password"></div><button style="width:100%">Create account →</button></form><div class="auth-foot">Already registered? <a href="/login">Sign in</a></div></main></body></html>
