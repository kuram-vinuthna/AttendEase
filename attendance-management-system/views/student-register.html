<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student registration | AttendEase</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head><body><body class="auth-body"><main class="auth-card"><div class="brand"><span class="brand-icon">✓</span><span>AttendEase</span></div><h1>Student portal registration</h1><p class="muted">Demo accounts: email firstname@sa.com and password your first name. Use the matching roll number.</p><div id="formMessage" class="hidden"></div><form id="studentRegisterForm"><div class="field"><label for="name">Full name</label><input id="name" required placeholder="Your full name"></div><div class="field"><label for="roll_no">College roll number</label><input id="roll_no" required placeholder="CS001"></div><div class="field"><label for="email">Registered student email</label><input id="email" type="email" required placeholder="you@college.edu"></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="1" required placeholder="Use your first name for demo login"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="1" required></div><button style="width:100%">Create student account →</button></form><div class="auth-foot">Already registered? <a href="/login">Sign in</a></div></main></body></body></html>
