<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add student | AttendEase</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head><body><div class="layout"><aside class="sidebar"><a class="brand" href="/dashboard"><span class="brand-icon">✓</span><span class="brand-name">AttendEase</span></a><div class="nav-label">Workspace</div><a class="nav-link" href="/dashboard"><span>▦</span><span class="nav-text">Dashboard</span></a><a class="nav-link" href="/students"><span>♙</span><span class="nav-text">Students</span></a><a class="nav-link" href="/attendance"><span>✓</span><span class="nav-text">Mark attendance</span></a><a class="nav-link" href="/attendance-report"><span>▤</span><span class="nav-text">Reports</span></a><a class="nav-link" href="/subjects"><span>▧</span><span class="nav-text">Subjects</span></a><a class="nav-link hidden" data-admin-only href="/admin-dashboard"><span>⚙</span><span class="nav-text">Admin panel</span></a><div class="side-user">Signed in as<br><strong id="userName">User</strong><br><span id="userRole">Teacher</span></div></aside><main class="main"><header class="topbar"><div><strong>Student record</strong><br><small>Add or update a student.</small></div><div class="topbar-right"><div class="avatar" id="userAvatar">U</div><button class="secondary" id="logoutButton">Sign out</button></div></header><section class="content"><div class="page-head"><div><h1 id="formTitle">Add student</h1><p>Fields marked with * are required.</p></div><a class="btn secondary" href="/students">← Back to students</a></div><div class="card" style="max-width:850px"><div id="formMessage" class="hidden"></div><form id="studentForm"><div class="form-grid"><div class="field"><label>Roll number *</label><input name="roll_no" required placeholder="e.g. CS005"></div><div class="field"><label>Full name *</label><input name="name" required placeholder="Student full name"></div><div class="field"><label>Email address</label><input name="email" type="email" placeholder="student@example.com"></div><div class="field"><label>Phone number</label><input name="phone" type="tel" placeholder="Phone number"></div><div class="field"><label>Department</label><input name="department" placeholder="e.g. Computer Science"></div><div class="field"><label>Year</label><select name="year"><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div></div><button type="submit">Save student</button> <a class="btn secondary" href="/students">Cancel</a></form></div></section></main></div></body></html>
